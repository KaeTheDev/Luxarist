name: CI/CD - Luxarist Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install & Build
        run: |
          cd client
          npm install
          npm run build

  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install & Build
        run: |
          cd server
          npm install
          npm run build

  deploy:
    name: Deploy to Render
    needs: [frontend, backend] # Only runs if build jobs pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Frontend
        run: curl -X POST ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        
      - name: Deploy Backend
        run: curl -X POST ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}